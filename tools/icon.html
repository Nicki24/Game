<!DOCTYPE html>
<html><head><meta charset="utf-8"></head><body style="margin:0;background:#000">
<canvas id="c"></canvas>
<script src="../www/js/util.js"></script>
<script src="../www/js/data.js"></script>
<script src="../www/js/sprites.js"></script>
<script>
// Dessine l'icône d'Éclipsia : éclipse dorée + Gardienne Lame-Tempête en pixel-art
window.__portrait = new Image();
window.__ready = new Promise((r) => { window.__portrait.onload = r; });
window.__portrait.src = G.sprites.portrait('humanoid', G.data.CLASSES.tempete.pal, false, G.data.CLASSES.tempete.look, 512);
function drawIcon(size, opts = {}) {
  const c = document.getElementById('c');
  c.width = opts.w || size; c.height = size;
  const x = c.getContext('2d');
  const W = c.width, H = c.height, u = H / 100;
  const bg = x.createRadialGradient(W / 2, H * 0.42, 0, W / 2, H * 0.5, Math.max(W, H) * 0.7);
  bg.addColorStop(0, '#4a2f8a'); bg.addColorStop(0.55, '#1c1238'); bg.addColorStop(1, '#07040e');
  x.fillStyle = bg; x.fillRect(0, 0, W, H);
  // Étoiles
  const r = G.util.rng(7);
  for (let i = 0; i < 40 * (W / H); i++) { x.fillStyle = `rgba(255,255,255,${0.3 + r() * 0.6})`; x.fillRect(r() * W, r() * H * 0.7, u * 0.6, u * 0.6); }
  // Éclipse
  const cx = W / 2, cy = H * 0.44, R = 33 * u;
  const glow = x.createRadialGradient(cx, cy, R * 0.8, cx, cy, R * 1.9);
  glow.addColorStop(0, 'rgba(255,190,70,0.95)'); glow.addColorStop(0.35, 'rgba(255,120,40,0.45)'); glow.addColorStop(1, 'rgba(255,90,20,0)');
  x.fillStyle = glow; x.beginPath(); x.arc(cx, cy, R * 1.9, 0, Math.PI * 2); x.fill();
  x.fillStyle = '#fff3b0'; x.beginPath(); x.arc(cx, cy, R * 1.04, 0, Math.PI * 2); x.fill();
  x.fillStyle = '#0a0616'; x.beginPath(); x.arc(cx, cy, R, 0, Math.PI * 2); x.fill();
  x.fillStyle = '#20154a'; x.beginPath(); x.arc(cx + R * 0.18, cy + R * 0.1, R * 0.82, 0, Math.PI * 2); x.fill();
  // Portrait de l'héroïne dans l'éclipse
  const C = G.data.CLASSES.tempete;
  const img = window.__portrait;
  x.save(); x.beginPath(); x.arc(cx, cy, R * 0.92, 0, Math.PI * 2); x.clip();
  x.drawImage(img, cx - R * 0.92, cy - R * 0.92, R * 1.84, R * 1.84); x.restore();
  x.strokeStyle = '#ffd84a'; x.lineWidth = u * 1.5; x.beginPath(); x.arc(cx, cy, R * 0.92, 0, Math.PI * 2); x.stroke();
  // Épée en travers
  x.save(); x.translate(cx - R * 1.05, cy + R * 1.42); x.scale(3.3 * u, 3.3 * u); x.lineJoin = 'round';
  G.sprites.drawWeapon(x, 'epee', -0.42, 1, null); x.restore();
  if (opts.title) {
    x.textAlign = 'center';
    x.font = `bold ${16 * u}px Georgia, serif`;
    const g = x.createLinearGradient(0, H * 0.1, 0, H * 0.3);
    g.addColorStop(0, '#fff3b0'); g.addColorStop(1, '#ff9a3c');
    x.lineWidth = u * 1.6; x.strokeStyle = '#2a1408';
    x.strokeText('ÉCLIPSIA', W * 0.22, H * 0.48); x.fillStyle = g; x.fillText('ÉCLIPSIA', W * 0.22, H * 0.48);
    x.font = `italic ${6 * u}px Georgia, serif`; x.fillStyle = '#e8d8ff';
    x.fillText("Les Gardiens de l'Aube", W * 0.22, H * 0.6);
    x.strokeText('RPG', W * 0.78, H * 0.48);
  }
  return c.toDataURL('image/png');
}
</script></body></html>
